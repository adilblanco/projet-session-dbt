version: 2

models:
  - name: dim_customers
    description: >
      Dimension client : une ligne par personne (customer_unique_id).
      SCD type 1 : seul le dernier état connu est conservé (commande la plus récente).
    columns:
      - name: customer_sk
        description: Clé de substitution du client (hash de customer_unique_id).
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "Clé naturelle : identifiant de la personne dans la source."
        data_tests:
          - unique
          - not_null

      - name: state
        description: État (province) du client, celui de sa commande la plus récente (ex. SP).
        data_tests:
          - not_null

  - name: dim_date
    description: >
      Dimension date générée : une ligne par jour de 2016 à 2018.
      Hiérarchie : jour -> mois -> trimestre -> année.
    columns:
      - name: date_sk
        description: Clé de substitution de la date (hash de date_day).
        data_tests:
          - unique
          - not_null

      - name: date_day
        description: Le jour (niveau bas de la hiérarchie).
        data_tests:
          - unique
          - not_null

      - name: month
        description: Mois (1 à 12).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12

      - name: quarter
        description: Trimestre (1 à 4).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

      - name: year
        description: Année (niveau haut de la hiérarchie).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2016, 2017, 2018]
                quote: false

  - name: fct_orders
    description: >
      Fait commande : une ligne par commande (table de situation : suit la commande de l'achat à l'avis).
      Relié à dim_customers et à dim_date (dates d'achat, de livraison et de livraison estimée).
    data_tests:
      # une ligne par commande : autant de lignes que dans stg_orders
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_orders')
      # une commande livrée a toujours un indicateur de retard
      - dbt_utils.expression_is_true:
          arguments:
            expression: "delivery_days is null or is_late is not null"
    columns:
      - name: order_id
        description: Identifiant de la commande (dimension dégénérée) ; définit le grain.
        data_tests:
          - unique
          - not_null

      - name: order_status
        description: Statut de la commande (dimension dégénérée).

      - name: delivery_state
        description: >
          État de l'adresse de livraison au moment de la commande (dimension dégénérée).
          Peut différer de dim_customers.state, qui ne garde que le dernier état du client (SCD type 1).
        data_tests:
          - not_null

      - name: customer_sk
        description: Clé du client (personne) dans dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk

      - name: purchase_date_sk
        description: Date d'achat dans dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk

      - name: delivered_date_sk
        description: Date de livraison au client dans dim_date ; null si non livrée.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk

      - name: estimated_delivery_date_sk
        description: Date de livraison estimée dans dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk

      - name: purchase_date
        description: Date d'achat en clair ; axe temporel de la couche sémantique.
        data_tests:
          - not_null

      - name: delivered_date
        description: Date de livraison en clair ; axe temporel des mesures de retard ; null si non livrée.

      - name: order_amount
        description: Montant total de la commande (articles + frais de port), en BRL.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: delivery_days
        description: Jours entre l'achat et la livraison au client ; null si non livrée.

      - name: is_late
        description: Vrai si livrée après la date estimée ; null si non livrée.

      - name: review_score
        description: Note de l'avis retenu (1 à 5) ; null si aucun avis.

      - name: sentiment_label
        description: Sentiment du commentaire (dimension dégénérée) ; positive, neutral ou negative ; null si aucun commentaire.

