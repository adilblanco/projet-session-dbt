version: 2

models:
  - name: dim_customers
    description: >
      Dimension client : une ligne par personne (customer_unique_id).
      SCD type 1 : seule la dernière adresse connue est conservée (commande la plus récente).
      Hiérarchie géographique : ville -> état.
    columns:
      - name: customer_sk
        description: Clé de substitution du client (hash de customer_unique_id).
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "Clé naturelle : identifiant de la personne dans la source."
        data_tests:
          - unique
          - not_null

      - name: zip_code_prefix
        description: Cinq premiers chiffres du code postal de la dernière adresse connue.

      - name: city
        description: Ville de la dernière adresse connue (niveau bas de la hiérarchie).

      - name: state
        description: État de la dernière adresse connue (niveau haut de la hiérarchie).
        data_tests:
          - not_null

  - name: dim_date
    description: >
      Dimension date générée : une ligne par jour de 2016 à 2018, plus une ligne « Unknown »
      pour les dates nulles des faits. Hiérarchie : jour -> mois -> trimestre -> année.
      Utilisée dans plusieurs rôles (achat, livraison estimée, livraison réelle).
    columns:
      - name: date_sk
        description: Clé de substitution de la date (hash de date_day ; la ligne Unknown a le hash d'une date nulle).
        data_tests:
          - unique
          - not_null

      - name: date_day
        description: Le jour (null pour la ligne Unknown).
        data_tests:
          - unique

      - name: year
        description: Année.

      - name: quarter
        description: Trimestre (1 à 4).

      - name: month
        description: Mois (1 à 12).

      - name: year_month
        description: Année et mois au format AAAA-MM ; « Unknown » pour la ligne inconnue.
        data_tests:
          - not_null

      - name: day_name
        description: Nom du jour de la semaine (en anglais).

      - name: is_weekend
        description: Vrai le samedi et le dimanche.

  - name: dim_products
    description: >
      Dimension produit : une ligne par produit.
      La traduction anglaise de la catégorie est intégrée (dénormalisation, schéma en étoile).
    columns:
      - name: product_sk
        description: Clé de substitution du produit (hash de product_id).
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: "Clé naturelle : identifiant du produit dans la source."
        data_tests:
          - unique
          - not_null

      - name: category_name
        description: >
          Catégorie en anglais. Nom portugais si la traduction manque (2 catégories),
          « unknown » si le produit n'a pas de catégorie (610 produits).
        data_tests:
          - not_null

      - name: category_name_pt
        description: Catégorie d'origine en portugais ; « unknown » si absente.
        data_tests:
          - not_null

      - name: photos_count
        description: Nombre de photos publiées pour le produit.

      - name: weight_g
        description: Poids du produit, en grammes.

      - name: volume_cm3
        description: Volume du colis, en centimètres cubes.

  - name: dim_sellers
    description: >
      Dimension vendeur : une ligne par vendeur.
      Hiérarchie géographique : ville -> état, avec les mêmes colonnes que dim_customers.
    columns:
      - name: seller_sk
        description: Clé de substitution du vendeur (hash de seller_id).
        data_tests:
          - unique
          - not_null

      - name: seller_id
        description: "Clé naturelle : identifiant du vendeur dans la source."
        data_tests:
          - unique
          - not_null

      - name: zip_code_prefix
        description: Cinq premiers chiffres du code postal du vendeur.

      - name: city
        description: Ville du vendeur (niveau bas de la hiérarchie).

      - name: state
        description: État du vendeur (niveau haut de la hiérarchie).
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      Fait commande : une ligne par commande (snapshot cumulatif achat -> livraison -> avis).
      Relié à dim_customers et à dim_date dans trois rôles (achat, livraison estimée, livraison réelle).
    columns:
      - name: order_id
        description: Identifiant de la commande (dimension dégénérée) ; définit le grain.
        data_tests:
          - unique
          - not_null

      - name: order_status
        description: Statut de la commande (dimension dégénérée).

      - name: customer_sk
        description: Clé du client (personne) dans dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk

      - name: purchase_date_sk
        description: "Rôle « date d'achat » de dim_date."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk

      - name: estimated_delivery_date_sk
        description: "Rôle « date de livraison estimée » de dim_date."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk

      - name: delivered_date_sk
        description: "Rôle « date de livraison réelle » de dim_date ; ligne Unknown si non livrée."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_sk

      - name: items_count
        description: Nombre d'articles de la commande (0 si aucun article).

      - name: items_amount
        description: Somme des prix des articles, en BRL.

      - name: freight_amount
        description: Somme des frais de port, en BRL.

      - name: order_amount
        description: Montant total de la commande (articles + frais de port), en BRL.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: delivery_days
        description: Jours entre l'achat et la livraison au client ; null si non livrée.

      - name: is_late
        description: Vrai si livrée après la date estimée ; null si non livrée.

      - name: review_score
        description: Note de l'avis retenu (1 à 5) ; null si aucun avis.

      - name: sentiment_score
        description: Score de sentiment du commentaire ; null si aucun commentaire.

      - name: sentiment_label
        description: Sentiment du commentaire (positive, neutral, negative) ; null si aucun commentaire.
