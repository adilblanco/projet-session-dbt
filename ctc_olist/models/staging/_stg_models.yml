version: 2

models:
  - name: stg_orders
    description: >
      Commandes nettoyées : une ligne par commande (même grain que la source).
      Colonnes renommées et dates converties en timestamp/date.
    columns:
      - name: order_id
        description: Identifiant unique de la commande.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          Identifiant du client pour cette commande. Change à chaque commande :
          utiliser customer_unique_id (stg_customers) pour identifier la personne.
        data_tests:
          - not_null

      - name: order_status
        description: Statut de la commande (livrée, expédiée, annulée…).
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']

      - name: purchased_at
        description: Date et heure de l'achat.
        data_tests:
          - not_null

      - name: approved_at
        description: Date et heure de l'approbation du paiement.

      - name: delivered_to_carrier_at
        description: Date et heure de la remise au transporteur.

      - name: delivered_to_customer_at
        description: Date et heure de la livraison au client. Nulle si la commande n'est pas livrée.

      - name: estimated_delivery_date
        description: Date de livraison estimée communiquée au client à l'achat.

  - name: stg_customers
    description: >
      Clients nettoyés : une ligne par customer_id (même grain que la source).
      Un même client a un customer_id différent à chaque commande.
    columns:
      - name: customer_id
        description: Identifiant du client pour une commande donnée (clé de jointure avec stg_orders).
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: Identifiant unique de la personne, stable d'une commande à l'autre.
        data_tests:
          - not_null

      - name: zip_code_prefix
        description: Cinq premiers chiffres du code postal du client (texte).

      - name: city
        description: Ville du client.

      - name: state
        description: État (province) du client, en abréviation de deux lettres (ex. SP).
        data_tests:
          - not_null

  - name: stg_order_items
    description: >
      Articles de commande nettoyés : une ligne par article d'une commande.
      Clé composée : order_id + order_item_number.
    # Test au niveau du modèle : unicité de la clé composée
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_number
    columns:
      - name: order_id
        description: Identifiant de la commande (clé de jointure avec stg_orders).
        data_tests:
          - not_null

      - name: order_item_number
        description: Numéro séquentiel de l'article dans la commande (1, 2, 3…).
        data_tests:
          - not_null

      - name: product_id
        description: Identifiant du produit vendu (clé de jointure avec stg_products).
        data_tests:
          - not_null

      - name: seller_id
        description: Identifiant du vendeur (clé de jointure avec stg_sellers).
        data_tests:
          - not_null

      - name: shipping_limit_at
        description: Date et heure limites pour la remise de l'article au transporteur.

      - name: price
        description: Prix de l'article, en réaux brésiliens (BRL).
        data_tests:
          - not_null

      - name: freight
        description: Frais de port de l'article, en BRL.

      - name: item_total
        description: Montant total de l'article (price + freight), en BRL.

  - name: stg_order_payments
    description: >
      Paiements nettoyés : une ligne par paiement d'une commande.
      Une commande peut avoir plusieurs paiements. Clé composée : order_id + payment_number.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_number
    columns:
      - name: order_id
        description: Identifiant de la commande (clé de jointure avec stg_orders).
        data_tests:
          - not_null

      - name: payment_number
        description: Numéro séquentiel du paiement dans la commande (1, 2, 3…).
        data_tests:
          - not_null

      - name: payment_type
        description: >
          Moyen de paiement (carte de crédit, boleto, bon d'achat, carte de débit).
          3 paiements ont la valeur not_defined à la source.
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

      - name: installments
        description: >
          Nombre de versements choisis par le client.
          Quelques paiements par carte de crédit valent 0 à la source (anomalie conservée).

      - name: amount
        description: Montant du paiement, en BRL.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
