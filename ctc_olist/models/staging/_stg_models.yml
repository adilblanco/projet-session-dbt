version: 2

models:
  - name: stg_orders
    description: >
      Commandes nettoyées : une ligne par commande (même grain que la source).
      Colonnes renommées et dates converties en timestamp/date.
    columns:
      - name: order_id
        description: Identifiant unique de la commande.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          Identifiant du client pour cette commande. Change à chaque commande :
          utiliser customer_unique_id (stg_customers) pour identifier la personne.
        data_tests:
          - not_null

      - name: order_status
        description: Statut de la commande (livrée, expédiée, annulée…).
        data_tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']

      - name: purchased_at
        description: Date et heure de l'achat.
        data_tests:
          - not_null

      - name: approved_at
        description: Date et heure de l'approbation du paiement.

      - name: delivered_to_carrier_at
        description: Date et heure de la remise au transporteur.

      - name: delivered_to_customer_at
        description: Date et heure de la livraison au client. Nulle si la commande n'est pas livrée.

      - name: estimated_delivery_date
        description: Date de livraison estimée communiquée au client à l'achat.

  - name: stg_customers
    description: >
      Clients nettoyés : une ligne par customer_id (même grain que la source).
      Un même client a un customer_id différent à chaque commande.
    columns:
      - name: customer_id
        description: Identifiant du client pour une commande donnée (clé de jointure avec stg_orders).
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: Identifiant unique de la personne, stable d'une commande à l'autre.
        data_tests:
          - not_null

      - name: zip_code_prefix
        description: Cinq premiers chiffres du code postal du client (texte).

      - name: city
        description: Ville du client.

      - name: state
        description: État (province) du client, en abréviation de deux lettres (ex. SP).
        data_tests:
          - not_null

  - name: stg_order_items
    description: >
      Articles de commande nettoyés : une ligne par article d'une commande.
      Clé composée : order_id + order_item_number.
    # Test au niveau du modèle : unicité de la clé composée
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_number
    columns:
      - name: order_id
        description: Identifiant de la commande (clé de jointure avec stg_orders).
        data_tests:
          - not_null

      - name: order_item_number
        description: Numéro séquentiel de l'article dans la commande (1, 2, 3…).
        data_tests:
          - not_null

      - name: product_id
        description: Identifiant du produit vendu (clé de jointure avec stg_products).
        data_tests:
          - not_null

      - name: seller_id
        description: Identifiant du vendeur (clé de jointure avec stg_sellers).
        data_tests:
          - not_null

      - name: shipping_limit_at
        description: Date et heure limites pour la remise de l'article au transporteur.

      - name: price
        description: Prix de l'article, en réaux brésiliens (BRL).
        data_tests:
          - not_null

      - name: freight
        description: Frais de port de l'article, en BRL.

      - name: item_total
        description: Montant total de l'article (price + freight), en BRL.

  - name: stg_order_payments
    description: >
      Paiements nettoyés : une ligne par paiement d'une commande.
      Une commande peut avoir plusieurs paiements. Clé composée : order_id + payment_number.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_number
    columns:
      - name: order_id
        description: Identifiant de la commande (clé de jointure avec stg_orders).
        data_tests:
          - not_null

      - name: payment_number
        description: Numéro séquentiel du paiement dans la commande (1, 2, 3…).
        data_tests:
          - not_null

      - name: payment_type
        description: >
          Moyen de paiement (carte de crédit, boleto, bon d'achat, carte de débit).
          3 paiements ont la valeur not_defined à la source.
        data_tests:
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

      - name: installments
        description: >
          Nombre de versements choisis par le client.
          Quelques paiements par carte de crédit valent 0 à la source (anomalie conservée).

      - name: amount
        description: Montant du paiement, en BRL.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: stg_order_reviews
    description: >
      Avis clients nettoyés : une ligne par avis (même grain que la source).
      Une commande peut avoir plusieurs avis ; le plus récent sera retenu dans la couche intermédiaire.
      Clé composée : review_id + order_id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - review_id
              - order_id
    columns:
      - name: review_id
        description: Identifiant de l'avis (non unique seul à la source).
        data_tests:
          - not_null

      - name: order_id
        description: Identifiant de la commande évaluée (clé de jointure avec stg_orders).
        data_tests:
          - not_null

      - name: review_score
        description: Note de satisfaction donnée par le client, de 1 à 5.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: comment_title
        description: Titre du commentaire (portugais). Vide pour environ 88 % des avis.

      - name: comment_message
        description: >
          Commentaire libre du client en portugais (source non structurée).
          Null si absent ou composé uniquement d'espaces.

      - name: survey_sent_date
        description: Date d'envoi du questionnaire de satisfaction au client.

      - name: answered_at
        description: Date et heure de la réponse du client ; sert à retenir l'avis le plus récent.

      - name: has_comment
        description: Vrai si le client a écrit un commentaire (comment_message non null).
        data_tests:
          - not_null

  - name: stg_products
    description: >
      Produits nettoyés : une ligne par produit.
      Colonnes mal orthographiées à la source (« lenght ») corrigées.
    columns:
      - name: product_id
        description: Identifiant unique du produit.
        data_tests:
          - unique
          - not_null

      - name: product_category_name
        description: >
          Catégorie du produit en portugais (clé de jointure avec la table de traduction).
          Null pour 610 produits.

      - name: name_length
        description: Nombre de caractères du nom du produit.

      - name: description_length
        description: Nombre de caractères de la description du produit.

      - name: photos_count
        description: Nombre de photos publiées pour le produit.

      - name: weight_g
        description: Poids du produit, en grammes.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: length_cm
        description: Longueur du colis, en centimètres.

      - name: height_cm
        description: Hauteur du colis, en centimètres.

      - name: width_cm
        description: Largeur du colis, en centimètres.

      - name: volume_cm3
        description: Volume du colis (longueur × hauteur × largeur), en centimètres cubes.

  - name: stg_sellers
    description: >
      Vendeurs nettoyés : une ligne par vendeur.
      Mêmes noms de colonnes de localisation que stg_customers.
    columns:
      - name: seller_id
        description: Identifiant unique du vendeur (clé de jointure avec stg_order_items).
        data_tests:
          - unique
          - not_null

      - name: zip_code_prefix
        description: Cinq premiers chiffres du code postal du vendeur (texte).

      - name: city
        description: Ville du vendeur.

      - name: state
        description: État (province) du vendeur, en abréviation de deux lettres (ex. SP).
        data_tests:
          - not_null
