# Nom du projet dbt (minuscules et soulignés seulement).
name: 'ctc_olist'
version: '1.0.0'

# Profil de connexion (défini dans profiles.yml).
profile: 'ctc_olist'

# Dossiers où dbt cherche chaque type de fichier.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# dossiers supprimés par la commande `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"


# Configuration des modèles
# Documentation : https://docs.getdbt.com/docs/configuring-models
#
# Matérialisation par couche (le « + » s'applique à tous les modèles du dossier) :
#   - staging : vues (léger, simple nettoyage des sources)
#   - marts   : tables (faits et dimensions, interrogés souvent)
models:
  ctc_olist:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    semantic:
      +materialized: view
