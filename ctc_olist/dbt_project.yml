# Nom du projet dbt (minuscules et soulignés seulement).
name: 'ctc_olist'
version: '1.0.0'

# Profil de connexion (défini dans profiles.yml).
profile: 'ctc_olist'

# Dossiers où dbt cherche chaque type de fichier.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# dossiers supprimés par la commande `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"


# Matérialisation par couche (le « + » s'applique à tous les modèles du dossier) :
#   - staging      : vues (simple nettoyage des sources)
#   - intermediate : vues (règles métier, non destinées aux utilisateurs)
#   - marts        : tables (faits et dimensions, interrogés souvent)
#   - semantic     : vues (calendrier de MetricFlow)
models:
  ctc_olist:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    semantic:
      +materialized: view
